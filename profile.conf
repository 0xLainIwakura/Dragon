# Dragon C2 - Malleable Profile Configuration
# Edit before running 'generate'. Future GUI will use this file.
#
# Lines starting with # are comments.s
# Format: key = value

# -- Beacon behavior --
beacon_interval_s = 20
jitter_pct = 20
reconnect_delay_ms = 5000

# -- HTTP / HTTPS --
http_user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
http_content_type = application/octet-stream
http_path_data = /1/help_desk
http_path_hs = /app_help_desk
http_extra_headers = 

# -- SMB --
smb_pipe_name = client.1.test

# -- DNS --
dns_domain = 1.client.it
dns_poll_ms = 3000

# -- Random size --
pkt_pad_min = 64
pkt_pad_max = 512